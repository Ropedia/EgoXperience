name: Deploy project website
on:
  push:
    branches: [main, codex/website-final]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate and package complete website
        run: |
          python3 site_assets.py
          python3 package-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
